services:
  - type: web
    name: web-scrapping-api
    plan: free
    runtime: docker
    branch: production
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - fromGroup: web-scrapping-shared
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: web-scrapping-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FLARESOLVERR_URL
        sync: false

databases:
  - name: web-scrapping-db
    plan: free

envVarGroups:
  - name: web-scrapping-shared
    envVars:
      - key: APP_KEY
        generateValue: true
